<!doctype html>
<!-- The app icon: four tiles of the game on green. One drawing for every size; it scales with the
     window. `npm run icons` makes the png's in public/ from it:
       apple-touch-icon.png  180  home screen on iPhone (the phone rounds the corners)
       icon-192.png, icon-512.png  the installed app on Android and desktop
       icon-maskable-512.png  the same with the tiles smaller (?maskable), for phones that cut the
                              icon to a circle or another shape: everything stays inside the middle 80% -->
<meta charset="utf-8">
<style>
  @font-face{font-family:B;font-weight:200 800;src:url("../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2") format("woff2-variations")}
  html{--tile:31vw;--gap:5.5vw}
  html.maskable{--tile:24.5vw;--gap:4.5vw}
  body{margin:0;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(165deg,#3CB574,#26854E);
    display:grid;place-content:center;grid-template-columns:repeat(2,var(--tile));gap:var(--gap);
    font-family:B,sans-serif;font-weight:800;font-size:calc(var(--tile) * .74);color:#15231D}
  /* raised tiles, like the cells in the game: a lighter face on a darker edge */
  i{height:var(--tile);border-radius:calc(var(--tile) * .24);background:#fff;box-shadow:0 calc(var(--tile) * .09) 0 #AFC3B7;
    display:grid;place-items:center;font-style:normal;line-height:1;transform:translateY(calc(var(--tile) * -.045))}
  i.b{background:#1B2D25;box-shadow:0 calc(var(--tile) * .09) 0 #08120D}
</style>
<script>if (location.search.includes('maskable')) document.documentElement.classList.add('maskable');</script>
<i>4</i><i class="b"></i><i class="b"></i><i>1</i>
