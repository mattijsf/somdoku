<!doctype html>
<!-- The picture WhatsApp shows with the link (public/og.png, 1200 x 630): the name, what a shared
     score looks like, and a game under way. `npm run og` makes it again. The puzzle in it is not
     one of the daily ones, so it gives nothing away. -->
<meta charset="utf-8">
<style>
  @font-face{font-family:B;font-weight:200 800;src:url("../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2") format("woff2-variations")}
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;overflow:hidden;background:#EDF1EC;color:#15231D;font-family:B,sans-serif;font-variant-numeric:tabular-nums;
    display:grid;grid-template-columns:1fr auto;align-items:center;padding:0 76px 0 84px}
  .mark{display:grid;grid-template-columns:repeat(2,38px);gap:6px;margin-bottom:20px}
  .mark i{height:38px;border-radius:10px;background:#fff;box-shadow:0 4px 0 #BDCAC1;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:26px}
  .mark i.b{background:#15231D;box-shadow:0 4px 0 #000}
  h1{font-size:100px;line-height:1;font-weight:800;letter-spacing:-.03em}
  p{margin-top:14px;font-size:35px;line-height:1.2;font-weight:600;color:#5A6A62}
  /* a shared score: the time, and a square per cell in the order they were filled */
  .bubble{display:inline-grid;gap:5px;margin-top:28px;padding:16px 24px 22px;background:#D3F0DC;border-radius:28px 28px 28px 8px}
  .bubble b{font-size:29px;font-weight:650;margin-bottom:5px}
  .bubble span{display:flex;gap:5px}
  .bubble i{width:27px;height:27px;border-radius:6px;background:#2E9B5F}
  .bubble i.y{background:#E0B32E}
  .board{display:grid;grid-template-columns:auto repeat(5,80px);gap:9px;font-weight:800}
  .clue{display:flex;font-size:28px;font-weight:750}
  .clue.col{flex-direction:column;justify-content:flex-end;align-items:center;line-height:1.25;padding-bottom:6px}
  .clue.row{justify-content:flex-end;align-items:center;gap:.5em;padding-right:12px}
  .cell{height:80px;border-radius:15px;background:#fff;box-shadow:0 4px 0 #BDCAC1;display:grid;place-items:center;font-size:46px;line-height:1}
  .cell.b{background:#15231D;box-shadow:0 4px 0 #000}
  .cell.sel{box-shadow:0 0 0 5px #2E9B5F}
</style>
<div>
  <div class="mark"><i>4</i><i class="b"></i><i class="b"></i><i>1</i></div>
  <h1>Somdoku</h1>
  <p>Daily Japanese sums</p>
  <div class="bubble"><b>Somdoku 12 · 3:42</b>
    <span><i></i><i></i><i></i><i></i><i></i></span>
    <span><i></i><i></i><i class="y"></i><i></i><i></i></span>
    <span><i></i><i></i><i></i><i></i><i></i></span>
    <span><i></i><i></i><i></i><i class="y"></i><i></i></span>
    <span><i></i><i></i><i></i><i></i><i></i></span>
  </div>
</div>
<div class="board">
  <div></div>
  <div class="clue col"><span>10</span></div><div class="clue col"><span>10</span></div><div class="clue col"><span>7</span><span>3</span></div><div class="clue col"><span>5</span><span>5</span></div><div class="clue col"><span>4</span><span>6</span></div>
  <div class="clue row"><span>3</span><span>7</span></div><div class="cell">3</div><div class="cell b"></div><div class="cell">1</div><div class="cell">2</div><div class="cell">4</div>
  <div class="clue row"><span>10</span></div><div class="cell">4</div><div class="cell">1</div><div class="cell">2</div><div class="cell">3</div><div class="cell b"></div>
  <div class="clue row"><span>8</span><span>2</span></div><div class="cell">1</div><div class="cell">3</div><div class="cell">4</div><div class="cell sel"></div><div class="cell"></div>
  <div class="clue row"><span>6</span><span>4</span></div><div class="cell">2</div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
  <div class="clue row"><span>10</span></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
</div>
