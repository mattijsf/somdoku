<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- The page has one look, a dark one. Saying so here lets the phone paint everything around
       and behind the page (the bars, the moment before the styles load) in the matching colour,
       also on a phone that is set to light. -->
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#15112A">
  <title>Somdoku</title>
  <meta name="description" content="A Japanese sums puzzle every day. Solve it and share your score.">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <!-- Installable as an app: "Add to Home Screen" on iPhone, "Install app" on Android. -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Somdoku">
  <!-- The picture and text WhatsApp shows with the link. These need the full address. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Somdoku">
  <meta property="og:title" content="Somdoku">
  <meta property="og:description" content="A Japanese sums puzzle every day. Solve it and share your score.">
  <meta property="og:url" content="https://somdoku.nl/">
  <meta property="og:image" content="https://somdoku.nl/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body data-view="ready">
  <!-- The page is drawn by React (src/main.tsx); <html lang> follows the language it shows. -->
  <div id="root"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
